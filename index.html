<style>
:root{
  --bg:#070b12; --bg2:#0c1322; --card:#101a2c; --card2:#0d1526;
  --line:#1c2a42; --line2:#243554;
  --gold:#f0b90b; --gold2:#e6a700; --cyan:#22d3ee; --green:#10b981; --red:#ef4444;
  --txt:#e6edf7; --dim:#8b9bb4; --dim2:#5b6b85;
  --mono:'SF Mono','JetBrains Mono',ui-monospace,Menlo,monospace;
}
[data-theme="light"]{
  --bg:#f4f7fb; --bg2:#eef2f8; --card:#ffffff; --card2:#f1f5fa;
  --line:#e2e8f0; --line2:#cbd5e1;
  --gold:#b8860b; --gold2:#a16207; --cyan:#0284c7; --green:#059669; --red:#dc2626;
  --txt:#0f172a; --dim:#475569; --dim2:#94a3b8;
}
[data-theme="light"] body{
  background-image:radial-gradient(1000px 400px at 80% -10%, rgba(2,132,199,.08), transparent),
                   radial-gradient(800px 300px at 10% -10%, rgba(184,134,11,.07), transparent);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh;
  background-image:radial-gradient(1000px 400px at 80% -10%, rgba(34,211,238,.08), transparent),
                   radial-gradient(800px 300px at 10% -10%, rgba(240,185,11,.06), transparent)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}

/* topbar */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line)}
.brand{font-size:18px;font-weight:800;letter-spacing:.5px}
.brand .g{color:var(--gold)}
.brand .sub{font-size:11px;color:var(--dim2);font-weight:400;margin-left:8px}
.nav a{color:var(--dim);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid transparent;transition:.15s}
.nav a:hover{color:var(--txt);background:var(--card)}
.nav a.on{color:var(--gold);border-color:var(--line2);background:var(--card)}
.theme-btn{margin-left:6px;background:var(--card);border:1px solid var(--line2);color:var(--txt);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.theme-btn:hover{border-color:var(--gold);transform:scale(1.05)}

/* statusbar */
.statusbar{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line);margin-bottom:20px;font-size:12px;color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(16,185,129,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.5)}70%{box-shadow:0 0 0 8px rgba(16,185,129,0)}100%{box-shadow:0 0 0 0 rgba(16,185,129,0)}}
.badge-24h{background:rgba(240,185,11,.12);border:1px solid rgba(240,185,11,.35);color:var(--gold);padding:2px 10px;border-radius:99px;font-weight:700;font-size:11px;letter-spacing:.5px}
[data-theme="light"] .badge-24h{background:rgba(184,134,11,.08);border-color:rgba(184,134,11,.35)}
.meta b{color:var(--txt);font-family:var(--mono);font-variant-numeric:tabular-nums}
.exch{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:6px;border:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim)}
.exch .s{width:6px;height:6px;border-radius:50%;background:var(--green)}

/* overview cards */
.ov{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}
.ovc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ovc .l{font-size:11px;color:var(--dim2);letter-spacing:.5px;margin-bottom:6px}
.ovc .v{font-size:26px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums}
.ovc .v.g{color:var(--gold)} .ovc .v.c{color:var(--cyan)} .ovc .v.gr{color:var(--green)} .ovc .v.r{color:var(--red)}
.ovc .s{font-size:11px;color:var(--dim2);margin-top:4px}

/* table */
.tblwrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tblhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.tblhead h2{font-size:15px}
.filters{display:flex;gap:8px}
.fbtn{background:var(--card2);border:1px solid var(--line);color:var(--dim);font-size:11px;padding:4px 10px;border-radius:6px;cursor:pointer;transition:.15s}
.fbtn.on{color:var(--gold);border-color:rgba(240,185,11,.4)}
[data-theme="light"] .fbtn.on{color:var(--gold);border-color:rgba(184,134,11,.4)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--dim2);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr{cursor:pointer;transition:background .12s}
tbody tr:hover{background:var(--card2)}
tr.exp td{background:var(--card2);font-size:12px;color:var(--dim);padding:10px 14px 10px 40px;cursor:default}
tr.exp td b{color:var(--txt)}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:11px;font-family:var(--mono);border:1px solid var(--line2)}
.tag.ok{color:var(--green);border-color:rgba(16,185,129,.4)}
.tag.no{color:var(--red);border-color:rgba(239,68,68,.4)}
.tag.warn{color:var(--gold);border-color:rgba(240,185,11,.4)}
.rate{font-weight:700}
.pos{color:var(--green)} .neg{color:var(--red)}
.exname{font-size:11px;color:var(--dim2);background:var(--card2);padding:1px 6px;border-radius:4px;margin-right:4px}

footer{margin-top:28px;display:flex;justify-content:space-between;font-size:11px;color:var(--dim2)}
@media(max-width:760px){.ov{grid-template-columns:repeat(2,1fr)}.wrap{padding:0 12px 40px}}
</style>
</head>

    </tr>
    <tr class="exp" data-exp="${list.indexOf(o)}" style="display:none">
      <td colspan="9">仓位 $${o.size_usd||100000} ｜ 手续费 <b>${o.fee_bps??'--'} bps</b> ｜ 空腿滑点 <b>${o.slip_short_bps??'--'} bps</b> ｜ 多腿滑点 <b>${o.slip_long_bps??'--'} bps</b> ｜ 总成本 <b>${o.total_cost_bps??'--'} bps</b> ｜ 净收益 <b class="${net>0?'pos':'neg'}">${net==null?'--':net.toFixed(1)} bps</b>${o.cost_reason?' ｜ '+esc(o.cost_reason):''}</td>
    </tr>`;
  }).join('');
  // 展开逻辑
  rows.querySelectorAll('tr[data-i]').forEach(tr=>{
    tr.onclick=()=>{const e=rows.querySelector(`tr.exp[data-exp="${tr.dataset.i}"]`);if(e)e.style.display=e.style.display==='none'?'':'none'};
  });
  // 计数
  const ops=ARB.opportunities||[];
  document.getElementById('nCand').textContent=ops.length;
  document.getElementById('nOk').textContent=ops.filter(o=>o.tradeable).length;
  const nets=ops.map(o=>o.net_bps).filter(v=>v!=null);
  document.getElementById('maxNet').textContent=nets.length?Math.max(...nets).toFixed(1)+' bps':'--';
  document.getElementById('nRisk').textContent=ops.filter(o=>o.risk&&o.risk.length>1).length;
  document.getElementById('scanTime').textContent=(ARB.scanned_at||new Date().toISOString().slice(11,16))+' UTC';
}
render('all');
document.querySelectorAll('.fbtn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.fbtn').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.f)};
});
</script>
</body>
</html>
